[test]
coverage = false
ignore = [
  "**/app/tests/e2e/*.e2e.ts",
  "**/packages/hyperbet-solana/anchor/tests/*.test.ts",
]
exclude = [
  "**/app/tests/e2e/*.spec.ts",
  "debug-page.spec.ts",
  "app-tabs-and-apis.spec.ts",
  "solana-clob-ui.spec.ts",
  "market-flows.spec.ts",
]

[install]
# Every runtime/build peer used by the launch workspaces is declared directly.
# Do not auto-install optional peer trees such as Storybook test tooling or
# React Native/Metro packages that are not part of the web release.
peer = false
