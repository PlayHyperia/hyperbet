[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
fight_oracle = "FHXu3csARjtD4hEcuw3WobxoEU98h6j2vVhXjwuJhnJu"
duel_market = "7fFo9jtxpCZKTuGGrxFekGE7EGGkD3LvcsrPzxBjnApG"

[programs.localnet]
fight_oracle = "FHXu3csARjtD4hEcuw3WobxoEU98h6j2vVhXjwuJhnJu"
duel_market = "7fFo9jtxpCZKTuGGrxFekGE7EGGkD3LvcsrPzxBjnApG"

[programs.testnet]
fight_oracle = "FHXu3csARjtD4hEcuw3WobxoEU98h6j2vVhXjwuJhnJu"
duel_market = "7fFo9jtxpCZKTuGGrxFekGE7EGGkD3LvcsrPzxBjnApG"

[programs.mainnet]
fight_oracle = "FHXu3csARjtD4hEcuw3WobxoEU98h6j2vVhXjwuJhnJu"
duel_market = "7fFo9jtxpCZKTuGGrxFekGE7EGGkD3LvcsrPzxBjnApG"

[registry]
url = "https://api.apr.dev"

[test]
startup_wait = 60000

[provider]
# Use localnet for testing (anchor test spins up a local validator)
# For devnet/mainnet deployments, use: anchor deploy --provider.cluster devnet
cluster = "localnet"
wallet = "~/.config/solana/hyperia-keys/deployer.json"

[workspace]
members = ["programs/fight_oracle", "programs/duel_market"]
types = "../app/src/idl"

[scripts]
test = "./node_modules/.bin/ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
