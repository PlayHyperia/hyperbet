name: Deploy Solana Duel v1 to Devnet

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Explicitly authorize the SOL-only devnet deployment"
        required: true
        default: DO_NOT_DEPLOY
        type: choice
        options:
          - DO_NOT_DEPLOY
          - DEPLOY_SOLANA_DUEL_V1_DEVNET

permissions:
  contents: read

concurrency:
  group: solana-duel-v1-devnet
  cancel-in-progress: false

jobs:
  deploy-solana-duel-v1-devnet:
    name: Deploy Solana Duel v1 to Devnet
    if: ${{ inputs.confirmation == 'DEPLOY_SOLANA_DUEL_V1_DEVNET' }}
    runs-on: ubuntu-24.04
    environment: solana-devnet
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Hyperbet toolchain
        uses: ./.github/actions/setup-hyperbet
        with:
          install-rust: "true"
          install-solana: "true"
          install-anchor: "true"

      - name: Install dependencies
        run: bash scripts/ci-install-verified.sh root

      - name: Prove SOL-only launch closure before exposing authorities
        run: |
          bun run ci:gate:registry:launch
          bun run ci:scope:solana

      - name: Prepare and validate SOL-only deployment identities
        shell: bash
        env:
          TESTNET_SOLANA_DEPLOYER_KEYPAIR: ${{ secrets.TESTNET_SOLANA_DEPLOYER_KEYPAIR }}
          TESTNET_SOLANA_FIGHT_ORACLE_PROGRAM_KEYPAIR: ${{ secrets.TESTNET_SOLANA_FIGHT_ORACLE_PROGRAM_KEYPAIR }}
          TESTNET_SOLANA_DUEL_MARKET_PROGRAM_KEYPAIR: ${{ secrets.TESTNET_SOLANA_DUEL_MARKET_PROGRAM_KEYPAIR }}
          SOLANA_DEVNET_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC_URL }}
          SOLANA_PM_REPORTER_PUBKEY: ${{ secrets.SOLANA_PM_REPORTER_PUBKEY }}
          SOLANA_PM_FINALIZER_PUBKEY: ${{ secrets.SOLANA_PM_FINALIZER_PUBKEY }}
          SOLANA_PM_CHALLENGER_PUBKEY: ${{ secrets.SOLANA_PM_CHALLENGER_PUBKEY }}
          SOLANA_PM_MARKET_OPERATOR_PUBKEY: ${{ secrets.SOLANA_PM_MARKET_OPERATOR_PUBKEY }}
          SOLANA_PM_TREASURY_PUBKEY: ${{ secrets.SOLANA_PM_TREASURY_PUBKEY }}
          SOLANA_PM_MARKET_MAKER_PUBKEY: ${{ secrets.SOLANA_PM_MARKET_MAKER_PUBKEY }}
          SOLANA_LAUNCH_FEE_POLICY_APPROVED: ${{ vars.SOLANA_DEVNET_FEE_POLICY_APPROVED }}
          SOLANA_LAUNCH_CONFIG_FREEZE_APPROVED: ${{ vars.SOLANA_DEVNET_CONFIG_FREEZE_APPROVED }}
          SOLANA_ORACLE_DISPUTE_WINDOW_SECS: ${{ vars.SOLANA_DEVNET_DISPUTE_WINDOW_SECONDS }}
          TRADE_TREASURY_FEE_BPS: ${{ vars.SOLANA_DEVNET_TRADE_TREASURY_FEE_BPS }}
          TRADE_MARKET_MAKER_FEE_BPS: ${{ vars.SOLANA_DEVNET_TRADE_MARKET_MAKER_FEE_BPS }}
          WINNINGS_MARKET_MAKER_FEE_BPS: ${{ vars.SOLANA_DEVNET_WINNINGS_MARKET_MAKER_FEE_BPS }}
        run: |
          set -euo pipefail
          umask 077
          required_values=(
            TESTNET_SOLANA_DEPLOYER_KEYPAIR
            TESTNET_SOLANA_FIGHT_ORACLE_PROGRAM_KEYPAIR
            TESTNET_SOLANA_DUEL_MARKET_PROGRAM_KEYPAIR
            SOLANA_PM_REPORTER_PUBKEY
            SOLANA_PM_FINALIZER_PUBKEY
            SOLANA_PM_CHALLENGER_PUBKEY
            SOLANA_PM_MARKET_OPERATOR_PUBKEY
            SOLANA_PM_TREASURY_PUBKEY
            SOLANA_PM_MARKET_MAKER_PUBKEY
            SOLANA_LAUNCH_FEE_POLICY_APPROVED
            SOLANA_LAUNCH_CONFIG_FREEZE_APPROVED
            SOLANA_ORACLE_DISPUTE_WINDOW_SECS
            TRADE_TREASURY_FEE_BPS
            TRADE_MARKET_MAKER_FEE_BPS
            WINNINGS_MARKET_MAKER_FEE_BPS
          )
          for required_name in "${required_values[@]}"; do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Missing required SOL-only deployment value: $required_name" >&2
              exit 1
            fi
          done
          if [[ "$SOLANA_LAUNCH_FEE_POLICY_APPROVED" != "true" ]]; then
            echo "SOLANA_DEVNET_FEE_POLICY_APPROVED must be exactly true" >&2
            exit 1
          fi
          if [[ "$SOLANA_LAUNCH_CONFIG_FREEZE_APPROVED" != "true" ]]; then
            echo "SOLANA_DEVNET_CONFIG_FREEZE_APPROVED must be exactly true" >&2
            exit 1
          fi

          identity_parent="${RUNNER_TEMP}/hyperbet-solana-duel-v1-identities"
          if [[ -e "${identity_parent}" ]]; then
            echo "Refusing to reuse an existing Solana deployment identity directory" >&2
            exit 1
          fi
          install -d -m 700 "${identity_parent}"
          identity_root="$(mktemp -d "${identity_parent}/run.XXXXXX")"
          program_keys_dir="$identity_root/solana-programs"
          install -d -m 700 "$identity_root" "$program_keys_dir"
          wallet_path="$identity_root/deployer.json"
          fight_keypair_path="$program_keys_dir/fight_oracle-keypair.json"
          market_keypair_path="$program_keys_dir/duel_market-keypair.json"
          printf '%s\n' "$TESTNET_SOLANA_DEPLOYER_KEYPAIR" >"$wallet_path"
          printf '%s\n' "$TESTNET_SOLANA_FIGHT_ORACLE_PROGRAM_KEYPAIR" >"$fight_keypair_path"
          printf '%s\n' "$TESTNET_SOLANA_DUEL_MARKET_PROGRAM_KEYPAIR" >"$market_keypair_path"
          chmod 600 "$wallet_path" "$fight_keypair_path" "$market_keypair_path"

          deployer_address="$(solana-keygen pubkey "$wallet_path")"
          solana-keygen pubkey "$fight_keypair_path" >/dev/null
          solana-keygen pubkey "$market_keypair_path" >/dev/null
          export SOLANA_DEPLOYER_ADDRESS_FOR_CHECK="$deployer_address"
          node --input-type=module -e '
            import { PublicKey } from "@solana/web3.js";
            const names = process.argv.slice(1);
            const values = names.map((name) => [name, process.env[name] ?? ""]);
            for (const [name, value] of values) new PublicKey(value);
            const unique = new Set(values.map(([, value]) => value));
            if (unique.size !== values.length) {
              throw new Error("Solana launch roles must use distinct public keys");
            }
          ' \
            SOLANA_DEPLOYER_ADDRESS_FOR_CHECK \
            SOLANA_PM_REPORTER_PUBKEY \
            SOLANA_PM_FINALIZER_PUBKEY \
            SOLANA_PM_CHALLENGER_PUBKEY \
            SOLANA_PM_MARKET_OPERATOR_PUBKEY \
            SOLANA_PM_TREASURY_PUBKEY \
            SOLANA_PM_MARKET_MAKER_PUBKEY

          {
            echo "ANCHOR_WALLET=$wallet_path"
            echo "SOLANA_STAGE_A_WALLET_PATH=$wallet_path"
            echo "STAGE_A_SOLANA_PROGRAM_KEYS_DIR=$program_keys_dir"
            echo "STAGE_A_FIGHT_ORACLE_PROGRAM_KEYPAIR=$fight_keypair_path"
            echo "STAGE_A_DUEL_MARKET_PROGRAM_KEYPAIR=$market_keypair_path"
            echo "SOLANA_EXPECTED_AUTHORITY=$deployer_address"
            echo "SOLANA_EXPECTED_UPGRADE_AUTHORITY=$deployer_address"
            echo "SOLANA_PM_REPORTER_PUBKEY=$SOLANA_PM_REPORTER_PUBKEY"
            echo "SOLANA_PM_FINALIZER_PUBKEY=$SOLANA_PM_FINALIZER_PUBKEY"
            echo "SOLANA_PM_CHALLENGER_PUBKEY=$SOLANA_PM_CHALLENGER_PUBKEY"
            echo "SOLANA_PM_MARKET_OPERATOR_PUBKEY=$SOLANA_PM_MARKET_OPERATOR_PUBKEY"
            echo "SOLANA_PM_TREASURY_PUBKEY=$SOLANA_PM_TREASURY_PUBKEY"
            echo "SOLANA_PM_MARKET_MAKER_PUBKEY=$SOLANA_PM_MARKET_MAKER_PUBKEY"
            echo "SOLANA_LAUNCH_FEE_POLICY_APPROVED=$SOLANA_LAUNCH_FEE_POLICY_APPROVED"
            echo "SOLANA_LAUNCH_CONFIG_FREEZE_APPROVED=$SOLANA_LAUNCH_CONFIG_FREEZE_APPROVED"
            echo "SOLANA_ORACLE_DISPUTE_WINDOW_SECS=$SOLANA_ORACLE_DISPUTE_WINDOW_SECS"
            echo "TRADE_TREASURY_FEE_BPS=$TRADE_TREASURY_FEE_BPS"
            echo "TRADE_MARKET_MAKER_FEE_BPS=$TRADE_MARKET_MAKER_FEE_BPS"
            echo "WINNINGS_MARKET_MAKER_FEE_BPS=$WINNINGS_MARKET_MAKER_FEE_BPS"
            if [[ -n "$SOLANA_DEVNET_RPC_URL" ]]; then
              echo "SOLANA_RPC_URL=$SOLANA_DEVNET_RPC_URL"
            fi
          } >>"$GITHUB_ENV"

      - name: Prepare deployment evidence directories
        run: mkdir -p .ci-artifacts/testnet-deployment .ci-artifacts/testnet-verification

      - name: Run read-only Solana deployment preflight
        run: bun run --cwd packages/hyperbet-solana deploy:preflight:devnet

      - name: Deploy the two Solana duel programs to devnet
        run: bun run --cwd packages/hyperbet-solana anchor:deploy:devnet

      - name: Initialize and freeze Solana duel configuration
        run: |
          node --import tsx packages/hyperbet-solana/scripts/init-pm-config.ts \
            --cluster devnet \
            --freeze \
            --out .ci-artifacts/testnet-deployment/solana-duel-v1-init-devnet.json

      - name: Verify Solana duel deployment
        run: |
          node --import tsx packages/hyperbet-solana/scripts/verify-deployment.ts \
            --cluster devnet \
            --out .ci-artifacts/testnet-verification/solana-duel-v1-devnet.json
          bun run packages/hyperbet-solana/scripts/preflight-contract-deploy.ts \
            --cluster devnet \
            --require-deployed

      - name: Cleanup Solana deployment identities
        if: always()
        run: |
          set -euo pipefail
          identity_parent="${RUNNER_TEMP}/hyperbet-solana-duel-v1-identities"
          case "${identity_parent}" in
            "${RUNNER_TEMP%/}"/hyperbet-solana-duel-v1-identities)
              if [[ -d "${identity_parent}" ]]; then
                find "${identity_parent}" -depth -mindepth 1 -delete
                rmdir "${identity_parent}"
              fi
              ;;
            *)
              echo "Refusing to clean an unexpected Solana deployment identity path" >&2
              exit 1
              ;;
          esac

      - name: Upload Solana deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solana-duel-v1-devnet-deployment
          path: .ci-artifacts
          if-no-files-found: error
