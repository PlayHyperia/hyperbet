name: Deploy Hyperbet Solana Pages

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - preview
          - production
      production_confirmation:
        description: Type DEPLOY_SOL_PRODUCTION for a production deployment
        required: false
        default: ""
        type: string
      production_commit_sha:
        description: Full main-branch commit SHA approved for production
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_CLI_VERSION: "4.72.0"

jobs:
  deploy:
    name: Deploy hyperbet-solana pages
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify production promotion request
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
          PRODUCTION_COMMIT_SHA: ${{ inputs.production_commit_sha }}
        run: |
          node packages/hyperbet-solana/scripts/verify-production-promotion.mjs \
            --environment "$REQUESTED_ENVIRONMENT" \
            --confirmation "$PRODUCTION_CONFIRMATION" \
            --expected-sha "$PRODUCTION_COMMIT_SHA" \
            --ref "$GITHUB_REF" \
            --actual-sha "$GITHUB_SHA"

      - name: Resolve deployment target
        run: node scripts/ci-solana-pages-deploy-target.mjs >> "$GITHUB_ENV"
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          HYPERBET_CLOUDFLARE_ACCOUNT_ID: ${{ vars.HYPERBET_CLOUDFLARE_ACCOUNT_ID }}
          HYPERBET_SOLANA_STREAM_SOURCES: ${{ vars.HYPERBET_SOLANA_STREAM_SOURCES }}
          HYPERBET_SOLANA_PAGES_PROJECT_NAME: ${{ vars.HYPERBET_SOLANA_PAGES_PROJECT_NAME }}
          HYPERBET_SOLANA_PAGES_PRODUCTION_URL: ${{ vars.HYPERBET_SOLANA_PAGES_PRODUCTION_URL }}
          HYPERBET_SOLANA_KEEPER_URL: ${{ vars.HYPERBET_SOLANA_KEEPER_URL }}
          HYPERBET_SOLANA_KEEPER_WS_URL: ${{ vars.HYPERBET_SOLANA_KEEPER_WS_URL }}
          HYPERBET_SOLANA_STAGING_STREAM_SOURCES: ${{ vars.HYPERBET_SOLANA_STAGING_STREAM_SOURCES }}
          HYPERBET_SOLANA_PAGES_STAGING_PROJECT_NAME: ${{ vars.HYPERBET_SOLANA_PAGES_STAGING_PROJECT_NAME }}
          HYPERBET_SOLANA_PAGES_STAGING_URL: ${{ vars.HYPERBET_SOLANA_PAGES_STAGING_URL }}
          HYPERBET_SOLANA_KEEPER_STAGING_URL: ${{ vars.HYPERBET_SOLANA_KEEPER_STAGING_URL }}
          HYPERBET_SOLANA_KEEPER_STAGING_WS_URL: ${{ vars.HYPERBET_SOLANA_KEEPER_STAGING_WS_URL }}

      - name: Setup Hyperbet toolchain
        uses: ./.github/actions/setup-hyperbet

      - name: Install dependencies
        run: |
          bash scripts/ci-install-verified.sh root hyperbet-solana-app

      - name: Audit deploy env
        run: node --import tsx scripts/ci-env-audit-solana-v1.ts --target=pages:solana --deployment=${DEPLOY_TARGET}
        env:
          VITE_GAME_API_URL: ${{ env.HYPERBET_API_URL }}
          VITE_GAME_WS_URL: ${{ env.HYPERBET_WS_URL }}
          VITE_SOLANA_CLUSTER: ${{ env.DEPLOY_SOLANA_CLUSTER }}
          VITE_STREAM_SOURCES: ${{ env.VITE_STREAM_SOURCES }}
          VITE_TRANSACTIONS_ENABLED: ${{ env.VITE_TRANSACTIONS_ENABLED }}
          VITE_USE_GAME_RPC_PROXY: "true"

      - name: Build production app
        run: bun run --cwd packages/hyperbet-solana/app build --mode "${DEPLOY_SOLANA_CLUSTER}"
        env:
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
          VITE_GAME_API_URL: ${{ env.HYPERBET_API_URL }}
          VITE_GAME_WS_URL: ${{ env.HYPERBET_WS_URL }}
          VITE_SOLANA_CLUSTER: ${{ env.DEPLOY_SOLANA_CLUSTER }}
          VITE_STREAM_SOURCES: ${{ env.VITE_STREAM_SOURCES }}
          VITE_TRANSACTIONS_ENABLED: ${{ env.VITE_TRANSACTIONS_ENABLED }}
          VITE_USE_GAME_RPC_PROXY: "true"

      - name: Verify SOL-only production bundle
        run: bun run ci:scope:solana

      - name: Verify dist hygiene
        run: |
          test -f packages/hyperbet-solana/app/dist/build-info.json
          node scripts/verify-solana-pages-deployment.mjs --local-only
          if find packages/hyperbet-solana/app/dist -name '*.map' | grep -q .; then
            echo "Unexpected source maps in production dist"
            exit 1
          fi
          if grep -R -n "api-key=" packages/hyperbet-solana/app/dist; then
            echo "Provider key leak detected in dist"
            exit 1
          fi

      - name: Install pinned Wrangler CLI before exposing credentials
        run: |
          npm install --global "wrangler@${WRANGLER_CLI_VERSION}"
          installed_wrangler_version="$(wrangler --version | tr -d '\r' | awk '{print $NF}')"
          test "${installed_wrangler_version}" = "${WRANGLER_CLI_VERSION}"

      - name: Deploy to Cloudflare Pages
        working-directory: packages/hyperbet-solana/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WRANGLER_CONFIG_B64: ${{ secrets.CLOUDFLARE_WRANGLER_CONFIG_B64 }}
        run: |
          if [ "${DEPLOY_TARGET}" = "preview" ]; then
            case "${GITHUB_RUN_ID}" in
              ''|*[!0-9]*)
                echo "GITHUB_RUN_ID must be numeric" >&2
                exit 1
                ;;
            esac
            BRANCH="preview-${GITHUB_RUN_ID}"
          elif [ "${DEPLOY_TARGET}" = "staging" ]; then
            BRANCH="staging"
          else
            BRANCH="main"
          fi

          COMMIT_MSG=$(git log -1 --pretty=%s | tr -d '"' | cut -c1-100)

          bash ../../../scripts/run-wrangler-with-scoped-auth.sh \
            wrangler pages deploy dist \
            --project-name="${PAGES_PROJECT_NAME}" \
            --branch="${BRANCH}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${COMMIT_MSG}" \
            --commit-dirty=true \
            --skip-caching

      - name: Resolve deployed Pages URL
        id: deployment_url
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.environment != 'preview' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WRANGLER_CONFIG_B64: ${{ secrets.CLOUDFLARE_WRANGLER_CONFIG_B64 }}
        run: bash scripts/resolve-pages-deployment-url-with-scoped-auth.sh

      - name: Verify production build metadata
        id: verify_deployment
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.environment != 'preview' }}
        env:
          DEPLOYED_URL: ${{ steps.deployment_url.outputs.deployed_url }}
        run: node scripts/verify-solana-pages-deployment.mjs --output="${RUNNER_TEMP}/hyperbet-solana-pages-deployment-evidence.json"

      - name: Upload Pages deployment evidence
        if: ${{ steps.verify_deployment.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyperbet-solana-pages-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hyperbet-solana-pages-deployment-evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
