name: Fund Solana Devnet Launch Wallets

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Explicitly authorize Solana devnet funding"
        required: true
        default: DO_NOT_FUND
        type: choice
        options:
          - DO_NOT_FUND
          - FUND_SOLANA_DEVNET_WALLETS
      recipients:
        description: "Comma-separated Base58Address=SOLAmount pairs; maximum 10 SOL per recipient"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fund-solana-devnet-launch-wallets
  cancel-in-progress: false

jobs:
  fund-solana-devnet-wallets:
    name: Fund Solana devnet launch wallets
    if: ${{ inputs.confirmation == 'FUND_SOLANA_DEVNET_WALLETS' }}
    runs-on: ubuntu-24.04
    environment: solana-devnet
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Solana CLI
        uses: ./.github/actions/setup-hyperbet
        with:
          install-solana: "true"

      - name: Validate every recipient before exposing the funding signer
        env:
          RECIPIENTS: ${{ inputs.recipients }}
        run: |
          set -euo pipefail
          umask 077
          funding_plan_file="$(mktemp "${RUNNER_TEMP}/hyperbet-devnet-funding-plan.XXXXXX")"
          node scripts/ci-solana-devnet-funding-policy.mjs \
            --recipients "${RECIPIENTS}" >"${funding_plan_file}"

          while IFS= read -r address; do
            solana balance "${address}" --url devnet >/dev/null
          done < <(jq -r '.recipients[].address' "${funding_plan_file}")

          echo "SOLANA_DEVNET_FUNDING_PLAN=${funding_plan_file}" >>"${GITHUB_ENV}"

      - name: Fund the prevalidated recipient plan
        env:
          TESTNET_SOLANA_DEPLOYER_KEYPAIR: ${{ secrets.TESTNET_SOLANA_DEPLOYER_KEYPAIR }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${SOLANA_DEVNET_FUNDING_PLAN:-}" || ! -f "${SOLANA_DEVNET_FUNDING_PLAN}" ]]; then
            echo "Missing prevalidated Solana devnet funding plan" >&2
            exit 1
          fi
          case "${SOLANA_DEVNET_FUNDING_PLAN}" in
            "${RUNNER_TEMP%/}"/hyperbet-devnet-funding-plan.*) ;;
            *)
              echo "Refusing an unexpected Solana devnet funding-plan path" >&2
              exit 1
              ;;
          esac

          wallet_root=""
          cleanup_funding_material() {
            if [[ -n "${wallet_root}" ]]; then
              case "${wallet_root}" in
                "${RUNNER_TEMP%/}"/hyperbet-devnet-funder.*)
                  find "${wallet_root}" -depth -mindepth 1 -delete
                  rmdir "${wallet_root}"
                  ;;
                *)
                  echo "Refusing to clean an unexpected funding-key path" >&2
                  return 1
                  ;;
              esac
            fi
            find "${SOLANA_DEVNET_FUNDING_PLAN}" -delete
          }
          trap cleanup_funding_material EXIT

          if [[ -z "$TESTNET_SOLANA_DEPLOYER_KEYPAIR" ]]; then
            echo "Missing TESTNET_SOLANA_DEPLOYER_KEYPAIR" >&2
            exit 1
          fi

          wallet_root="$(mktemp -d "${RUNNER_TEMP}/hyperbet-devnet-funder.XXXXXX")"
          wallet_file="${wallet_root}/deployer.json"
          printf '%s' "$TESTNET_SOLANA_DEPLOYER_KEYPAIR" >"$wallet_file"
          chmod 600 "$wallet_file"
          solana-keygen pubkey "$wallet_file" >/dev/null

          while IFS=$'\t' read -r address amount; do
            solana transfer "${address}" "${amount}" \
              --url devnet \
              --keypair "${wallet_file}" \
              --allow-unfunded-recipient
          done < <(
            jq -r '.recipients[] | [.address, .amountSol] | @tsv' \
              "${SOLANA_DEVNET_FUNDING_PLAN}"
          )

          jq -r '.recipients[].address' "${SOLANA_DEVNET_FUNDING_PLAN}" |
            while IFS= read -r address; do
              solana balance "${address}" --url devnet
            done
